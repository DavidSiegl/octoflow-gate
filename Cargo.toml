# The quality gate: crates/gate is the `gate` binary; crates/checks its parser checks, over crates/model, the model of
# a source file that each language's front end, such as crates/lang-rust, reads; and xtask the workspace's own tasks,
# such as `cargo xtask smoke-release`. ci/package.sh builds the gate for a release.
[workspace]
members = ["crates/gate", "crates/model", "crates/checks", "crates/lang-python", "crates/lang-rust", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

# clippy's rules for the workspace: its defaults, and the lints below at warn.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# A suppression says why it stands: `#[allow(lint, reason = "...")]`.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
