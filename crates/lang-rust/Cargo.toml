[package]
name = "lang-rust"
version = "0.0.0"
description = "The gate's Rust front end: a Rust source file, read with tree-sitter, as the model the checks judge"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { path = "../model" }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
checks = { path = "../checks" }
