[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "octoflow-gate"
version = "0.1.0"
description = "The quality gate: judge the change a git working tree makes since a commit, and write the quality file"
readme = "README.md"
# gate.py is stdlib-only, so it runs with a system python3 3.13+ without uv.
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.2",
]

# The rules `gate.py` judges a change by. In the Gate stage the gate reads them from main's copy of this file
# (--config), so a change cannot loosen the rules it is judged by. Only findings on lines a change adds count, so the
# findings already on main do not block.

[tool.ruff.lint]
# The defaults, plus bugbear, simplifications, pyupgrade, bandit's security checks, complexity and pylint's errors
# and warnings, and W505 for comments and docstrings. No E501: code wraps at 120 by eye, since breaking a long
# expression can read worse than leaving it; a line of prose never does.
# Then a docstring on every public module, class, method and function, presence only. Not D105 or D107: a class's
# docstring documents its magic methods and __init__. No blind except Exception (BLE001) is in ruff's defaults, which
# extend-select keeps; a select would drop it.
extend-select = ["B", "SIM", "UP", "S", "C90", "PLE", "PLW", "W505", "D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; the tokens and /tmp paths are fakes; unused unpacked fixtures, dict() calls, class-level
# fake data are how the tests read best; a test documents itself by its name.
"tests/**" = ["S101", "S105", "S106", "S108", "RUF059", "RUF012", "C408", "C901", "D1"]

[tool.mypy]
# The tests are untyped by design; the gate is the typed surface.
files = ["gate.py"]

[tool.mutmut]
# What `gate.py`'s surviving-mutants check runs mutmut by, on a copy of the tree in which only the functions a change
# edits can be mutated (docs/quality-gate.md). mutmut runs the tests in a directory of its own, which holds only what
# is listed here; tests/test_gate.py builds the gate-rust helper from gate-rust/'s sources, without its target/:
# mutmut copies a file into a directory that must be there, which copying src/ first makes.
source_paths = ["gate.py"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["gate-rust/src/", "gate-rust/Cargo.toml", "gate-rust/Cargo.lock"]
# argparse's help and description texts: prose, not behaviour, which no test reads word for word. mutmut matches each
# pattern against each source line and skips every expression that starts on a matching line, with what it holds, the
# following lines of a text too. The patterns match any keyword argument of those names, not only argparse's. Flag
# names stay mutated: they are behaviour.
do_not_mutate_patterns = ['\bhelp=', '\bdescription=']

[tool.coverage.run]
# The C tracer, which the Jenkinsfile's Test stage records a context per test with (--cov-context=test), for gate.py
# --test-contexts to pick the tests mutmut runs. Under Python 3.14, coverage's default core, sys.monitoring, records
# each line for only the first few tests to run it, without a warning, so mutmut would leave out tests that kill its
# mutants and report them as survivors.
core = "ctrace"

[tool.pymarkdown]
# The docs wrap at 120, by eye.
plugins.md013.enabled = false
plugins.md033.enabled = false
