# Not a Python project: the gate is Rust (crates/). This file and uv.lock hold, with .python-version, the Python tools
# the gate runs when it judges this repository and that its tests run it with: the linters, and pytest and mutmut
# with their plugins, in the Python the tests give the gate as the judged project's (crates/gate/tests/common). They
# also hold the linters' rules. The release version is crates/gate/Cargo.toml's.

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.2",
]

# The rules the gate judges a change by. scripts/gate has the gate read them from the judge's copy of this file, the
# one beside the gate.toml it is given (--config), never the change's own, so a change cannot loosen the rules it is
# judged by (its header says which commit judges). Only findings on lines a change adds count, so the findings already
# on main do not block.

[tool.ruff.lint]
# The defaults, plus bugbear, simplifications, pyupgrade, bandit's security checks, complexity and pylint's errors
# and warnings, and W505 for comments and docstrings. No E501: code wraps at 120 by eye, since breaking a long
# expression can read worse than leaving it; a line of prose never does.
# Then a docstring on every public module, class, method and function, presence only. Not D105 or D107: a class's
# docstring documents its magic methods and __init__. No blind except Exception (BLE001) is in ruff's defaults, which
# extend-select keeps; a select would drop it.
extend-select = ["B", "SIM", "UP", "S", "C90", "PLE", "PLW", "W505", "D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
# The repository's Python: what the gate embeds to run in a judged project's Python.
files = ["crates/gate/src"]

[tool.pymarkdown]
# The docs wrap at 120, by eye.
plugins.md013.enabled = false
plugins.md033.enabled = false
